# Deep Research Agent — OpenRouter Configuration
# Uses free-tier models for all calls — zero cost.
#
# NOTE ON MODEL SLUGS: OpenRouter retires ":free" slugs without notice — the
# ones originally pinned here (deepseek-r1:free, llama-3.3-70b-instruct:free)
# now 404 ("unavailable for free, use the paid slug instead"), confirmed by
# direct API probe on 2026-08-02. If these also go stale, list current free
# models with:
#   curl -s https://openrouter.ai/api/v1/models | jq -r '.data[].id' | grep :free
# Free models have stricter rate limits (a shared account-wide daily cap) and
# some do NOT support JSON response_format, so LLMClient.complete_json falls
# back to prompt-based JSON extraction.

llm:
  sub_step_model: "google/gemma-4-26b-a4b-it:free"
  synthesis_model: "google/gemma-4-26b-a4b-it:free"
  temperature: 0.3
  max_tokens: 4000
  base_url: "https://openrouter.ai/api/v1"
  api_key_env: "OPENROUTER_API_KEY"

retrieval:
  search_results_per_query: 5
  max_rounds: 3
  chunk_size: 1500
  chunk_overlap: 200

adaptive:
  enabled: true
  min_budget: 1
  max_budget: 4
  low_confidence_threshold: 0.5
  novelty_threshold: 0.15

  # --- Effort allocation strategy (DECISIONS.md D027) ---
  # "threshold"  = original per-sub-question budget from an absolute difficulty
  #                bar. MEASURED unable to grant a 3rd round: 0 of 35
  #                sub-questions ever crossed it, because difficulty saturates
  #                at 0.13-0.31 while budget 3 needs 0.667.
  # "scheduler"  = global pool allocated by RANKING sub-questions on marginal
  #                value. No absolute bar to calibrate, so saturation cannot
  #                block multi-round research.
  strategy: "threshold"
  # scheduler-only. total_round_pool == number of sub-questions reproduces the
  # uniform baseline exactly.
  total_round_pool: 12
  max_rounds_per_sub_question: 4
  marginal_value_floor: 0.08
  target_claims_per_sub_question: 12

verification:
  enabled: true
  verifier_model: "google/gemma-4-26b-a4b-it:free"
  support_threshold: 0.4

evolution:
  enabled: true
  # Different MODEL FAMILY from sub_step_model (gemma) on purpose — the
  # challenger's whole job is to not share the extractor's blind spots.
  # Verified live via direct API probe on 2026-08-02; swap for any other free
  # OpenRouter model if this slug is later retired (see note above).
  challenger_model: "openai/gpt-oss-20b:free"
  challenger_base_url: ""      # inherits OpenRouter base_url
  challenger_api_key_env: ""   # inherits OPENROUTER_API_KEY
  reviser_model: ""
  # Free models are rate-limited — keep the per-round challenge budget small.
  max_challenges_per_round: 8
  stability_rounds: 2
  nuance_balance_threshold: 0.5
  reversal_balance_threshold: -0.3
  reasoning_soundness_threshold: 0.6

report_correction:
  # Phase 5: critique the finished report and fix it. Everything before this
  # improves individual claims; this is the only stage that asks whether the
  # ASSEMBLED report answers the question that was actually asked.
  enabled: true
  # Empty = reuse the evolution challenger's client, which is already a
  # different model from the synthesizer. A critic reviewing its own prose
  # ratifies it, and report-level defects are the ones users actually see.
  critic_model: ""
  max_passes: 2
  # Allow the critic to reopen retrieval when the evidence base itself (not the
  # writing) is inadequate. Capped at one reopen per sub-question regardless.
  allow_research_reopen: true
  thin_confidence_threshold: 0.45
  # Stop if a pass fails to reduce high-severity defects — a critic that keeps
  # finding fault is not evidence it is right (TESTING.md section 11).
  stop_when_not_improving: true

synthesis:
  include_gaps: true
  output_format: "markdown"

eval:
  calibration_bins: 10
