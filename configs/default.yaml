# Deep Research Agent — Default Configuration
# Every knob here maps to a design decision documented in DESIGN.md

llm:
  # Sub-step model: cheap, fast, good enough for extraction/verification
  sub_step_model: "gpt-4o-mini"
  # Synthesis model: stronger, for final report generation
  synthesis_model: "gpt-4o"
  temperature: 0.3
  max_tokens: 2000

retrieval:
  # Number of search results per sub-question per round
  search_results_per_query: 5
  # Maximum retrieval rounds (adaptive allocator may use fewer)
  max_rounds: 3
  # Chunk size for splitting retrieved text (characters)
  chunk_size: 1500
  # Overlap between chunks (characters)
  chunk_overlap: 200

adaptive:
  # Track A: adaptive test-time compute
  enabled: true
  # Minimum compute budget (retrieval rounds) for any sub-question
  min_budget: 1
  # Maximum compute budget for hard sub-questions
  max_budget: 4
  # Confidence threshold below which extra rounds are triggered
  low_confidence_threshold: 0.5
  # How much novelty (new claims) justifies another round
  novelty_threshold: 0.15

  # --- Effort allocation strategy ---
  # "threshold"  = original per-sub-question budget from an absolute difficulty
  #                bar. MEASURED unable to grant a 3rd round: 0 of 35
  #                sub-questions ever crossed it, because difficulty saturates
  #                at 0.13-0.31 while budget 3 needs 0.667.
  # "scheduler"  = global pool allocated by RANKING sub-questions on marginal
  #                value. No absolute bar to calibrate, so saturation cannot
  #                block multi-round research.
  strategy: "threshold"
  # scheduler-only. total_round_pool == number of sub-questions reproduces the
  # uniform baseline exactly.
  total_round_pool: 12
  max_rounds_per_sub_question: 4
  marginal_value_floor: 0.08
  target_claims_per_sub_question: 12

verification:
  # Track B: evidence-grounded verification
  enabled: true
  # Model for verification (use different model to avoid self-agreement bias)
  verifier_model: "gpt-4o-mini"
  # Entailment threshold: claims below this support score are "insufficient"
  support_threshold: 0.4

evolution:
  # Claims are challenged and revised as evidence accumulates, instead of
  # being append-only.
  enabled: true
  # The challenger is ADVERSARIAL and deliberately a different model from
  # sub_step_model (which extracts the claims it attacks). Same model =
  # self-agreement bias; that configuration is the `evolution_self` ablation.
  challenger_model: "gpt-4o"
  # Optional: point the challenger at a different provider entirely for full
  # independence. Empty = inherit llm.base_url / llm.api_key_env.
  challenger_base_url: ""
  challenger_api_key_env: ""
  # Reviser rewrites the claim; empty = use sub_step_model.
  reviser_model: ""
  # Cost cap per round — lowest-confidence claims are challenged first.
  max_challenges_per_round: 12
  # A claim that survives this many consecutive challenges unchanged is frozen.
  stability_rounds: 2
  # Evidence balance gates: (sup_sources - ref_sources) / (sup + ref sources)
  # Above this, the claim stands as-is; below it, refuting evidence is real
  # enough to require a scope qualifier.
  nuance_balance_threshold: 0.5
  # Below this, refuting evidence is DOMINANT — flip the claim's position.
  reversal_balance_threshold: -0.3
  # Below this, the inference itself is unsound even if the evidence agrees.
  reasoning_soundness_threshold: 0.6

report_correction:
  # Phase 5: critique the finished report and fix it. Everything before this
  # improves individual claims; this is the only stage that asks whether the
  # ASSEMBLED report answers the question that was actually asked.
  enabled: true
  # Empty = reuse the evolution challenger's client, which is already a
  # different model from the synthesizer. A critic reviewing its own prose
  # ratifies it, and report-level defects are the ones users actually see.
  critic_model: ""
  max_passes: 2
  # Allow the critic to reopen retrieval when the evidence base itself (not the
  # writing) is inadequate. Capped at one reopen per sub-question regardless.
  allow_research_reopen: true
  thin_confidence_threshold: 0.45
  # Stop if a pass fails to reduce high-severity defects — a critic that keeps
  # finding fault is not evidence it is right.
  stop_when_not_improving: true

execution:
  # Sub-questions share no state by design, so they can be fanned out. Serial
  # remains the default and the reference behaviour; parallel is opt-in via
  # this flag or `run.py --parallel`.
  # Note: the "scheduler" allocation strategy re-ranks after every round and is
  # therefore inherently sequential — it ignores this and runs serially.
  parallel_sub_questions: false
  max_workers: 4
  # Test cases in the eval harness are fully independent runs, so this is the
  # safest parallelism in the project and the one that saves the most time.
  parallel_test_cases: false
  max_case_workers: 3

synthesis:
  # Include a "Known Gaps & Contradictions" section in reports
  include_gaps: true
  # Output format: "markdown" or "json"
  output_format: "markdown"

eval:
  # Number of confidence bins for reliability diagram
  calibration_bins: 10
