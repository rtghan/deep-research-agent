[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Adaptive deep research agent with evidence-grounded verification"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "requests>=2.28",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pydantic>=2.0",
    "pypdf>=4.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "duckduckgo-search>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
